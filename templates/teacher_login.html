<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teacher Login - QuizSphere AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


    <!-- LOGIN CONTAINER -->

    <div class="login-container">


        <!-- LOGO OUTSIDE BOX -->

        <div class="login-page-logo">

            🤖 QuizSphere AI

        </div>


        <!-- LOGIN BOX -->

        <div class="login-card">


            <h1>
                Teacher Login
            </h1>


            <p class="login-subtitle">
                Welcome back! Manage your smart learning classroom.
            </p>


            <!-- LOGIN FORM -->

            <form method="POST"
                  action="/teacher/login">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn">

                    🔐 Login

                </button>


            </form>


            <!-- REGISTER LINK -->

            <div class="login-register-link">

                Don't have an account?

                <a href="/register">
                    Register
                </a>

            </div>


            <!-- HOME LINK -->

            <div class="login-home-link">

                <a href="/">
                    ← Back to Home
                </a>

            </div>


        </div>

    </div>


</body>

</html>
