<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login - QuizSphere AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="login-container">

        <div class="login-page-logo">
            🤖 QuizSphere AI
        </div>

        <div class="login-card">

            <h1>Student Login</h1>

            <p class="login-subtitle">
                Welcome back! Continue your smart learning journey.
            </p>

            <form method="POST"
                  action="/student/login">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>

                <button
                    type="submit"
                    class="login-btn">

                    🔐 Login

                </button>

            </form>

            <div class="login-register-link">

                Don't have an account?

                <a href="/register">
                    Register
                </a>

            </div>

            <div class="login-home-link">

                <a href="/">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</body>

</html>
