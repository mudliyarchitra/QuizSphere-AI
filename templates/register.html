<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - QuizSphere AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


    <!-- REGISTER CONTAINER -->

    <div class="register-container">


        <!-- QUIZSPHERE AI LOGO
             OUTSIDE REGISTER BOX -->

        <div class="register-page-logo">
            🤖 QuizSphere AI
        </div>


        <!-- REGISTER BOX -->

        <div class="register-box">


            <!-- TITLE -->

            <h1>
                Create Account
            </h1>


            <p class="register-subtitle">
                Join QuizSphere AI and start your smart learning journey.
            </p>


            <!-- REGISTER FORM -->

            <form method="POST"
                  action="/register">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required>

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">
                        Role
                    </label>

                    <select
                        id="role"
                        name="role"
                        required>

                        <option value="student">
                            Student
                        </option>

                        <option value="teacher">
                            Teacher
                        </option>

                    </select>

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="register-btn">

                    📝 Register

                </button>


            </form>


            <!-- LOGIN LINK -->

            <div class="login-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </div>


            <!-- HOME LINK -->

            <div class="home-link">

                <a href="/">
                    ← Back to Home
                </a>

            </div>


        </div>

    </div>


</body>

</html>
