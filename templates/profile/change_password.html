<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password - QuizSphere AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}?v=999">

</head>

<body>

<!-- =========================================================
     CHANGE PASSWORD PAGE
========================================================= -->

<div class="change-password-page">

    <!-- LOGO -->

    <div class="change-password-logo">
        🤖 QuizSphere AI
    </div>


    <!-- MAIN CARD -->

    <div class="change-password-card">

        <!-- ICON -->

        <div class="change-password-icon">
            🔐
        </div>


        <!-- TITLE -->

        <h1>
            Change Password
        </h1>


        <p class="change-password-subtitle">
            Keep your QuizSphere AI account secure by updating your password.
        </p>


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="change-password-error">
            ⚠️ {{ error }}
        </div>

        {% endif %}


        <!-- FORM -->

        <form action="/change_password"
              method="POST">


            <!-- CURRENT PASSWORD -->

            <div class="change-password-group">

                <label>
                    Current Password
                </label>

                <input
                    type="password"
                    name="current_password"
                    placeholder="Enter current password"
                    required
                >

            </div>


            <!-- NEW PASSWORD -->

            <div class="change-password-group">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="change-password-group">

                <label>
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="change-password-btn">

                🔒 Change Password

            </button>

        </form>


        <!-- BACK -->

        <div class="change-password-back">

            <a href="/profile">
                ← Back to Profile
            </a>

        </div>

    </div>

</div>


</body>

</html>
